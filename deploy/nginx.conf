# Blinxot on one origin (recommended): nginx serves the built client and proxies the API on the same domain.
# Replace blinxot.com, then issue certificates:  sudo certbot --nginx -d blinxot.com -d www.blinxot.com
# Copy to /etc/nginx/sites-available/blinxot, symlink into sites-enabled, then: sudo nginx -t && sudo systemctl reload nginx

server {
  listen 80;
  server_name blinxot.com www.blinxot.com;
  return 301 https://blinxot.com$request_uri;
}

server {
  listen 443 ssl http2;
  server_name www.blinxot.com;
  ssl_certificate     /etc/letsencrypt/live/blinxot.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/blinxot.com/privkey.pem;
  return 301 https://blinxot.com$request_uri;
}

server {
  listen 443 ssl http2;
  server_name blinxot.com;
  ssl_certificate     /etc/letsencrypt/live/blinxot.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/blinxot.com/privkey.pem;

  root /var/www/blinxot/client/dist;
  index index.html;
  client_max_body_size 8m;                       # uploads are capped at MAX_UPLOAD_MB (5) by the API; leave headroom for multipart overhead
  gzip on; gzip_types text/css application/javascript application/json image/svg+xml application/xml;

  # Security headers. 'unsafe-inline' for styles is needed only because React sets style="" attributes.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  # API, uploaded public images, and the dynamic SEO files live in the Node server.
  location ~ ^/(api/|uploads/|sitemap\.xml$|robots\.txt$) {
    proxy_pass http://127.0.0.1:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Public entity pages go through the API so shared links get their own title/description/preview image.
  # (Requires CLIENT_DIST=/var/www/blinxot/client/dist in the server environment; the API serves the same index.html with meta filled in.)
  location ~ ^/(b/[^/]+|p/[^/]+|products/[0-9a-fA-F-]{36})$ {
    proxy_pass http://127.0.0.1:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # The service worker and manifest must never be cached for long, or updates would not reach installed apps.
  location = /sw.js              { add_header Cache-Control "no-cache" always; add_header Service-Worker-Allowed "/" always; try_files $uri =404; }
  location = /manifest.webmanifest { add_header Cache-Control "no-cache" always; default_type application/manifest+json; try_files $uri =404; }
  location = /index.html         { add_header Cache-Control "no-cache" always; }
  location /assets/              { add_header Cache-Control "public, max-age=31536000, immutable" always; try_files $uri =404; }

  # Never serve the private documents folder (it lives outside the web root; this is a belt-and-braces guard).
  location ~ -private/ { return 404; }

  # Single-page app: every other path is a client route.
  location / { try_files $uri /index.html; }
}
